version: '3.8'

services:
  # Servicio de PostgreSQL
  postgres:
    image: postgres:15-alpine  # Versión específica de PostgreSQL
    container_name: postgres-20260810
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: mi_app
    ports:
      - "5432:5432"  # Expone PostgreSQL en el puerto 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistencia de datos
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # Script inicial
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de Node.js
  node_app:
    build: .
    container_name: node-app-20260810
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: mi_app
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app  # Monta todo el código para desarrollo
      - /app/node_modules  # Evita sobrescribir node_modules
    restart: always
    command: npm run dev  # Modo desarrollo con nodemon

volumes:
  postgres_data:  # Volumen persistente para PostgreSQL
